# Evolution API standalone — pra rodar numa VPS própria (ex.: Oracle Cloud Always
# Free) quando o app Next.js está na Vercel, não nesta mesma máquina. Diferente do
# docker-compose.yml da raiz do repo (que sobe WAHA/Evolution pra DEV local): aqui
# não tem serviço `app` nenhum — só Evolution + Caddy na frente com HTTPS.
#
# Uso:
#   1. cp .env.example .env  e preencha EVOLUTION_API_KEY e DOMAIN/ACME_EMAIL
#   2. docker compose up -d
#   3. Aponte EVOLUTION_API_BASE_URL=https://$DOMAIN na Vercel (produção)

services:
  evolution-postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution-redis-data:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    environment:
      # Mesma key que EVOLUTION_API_KEY na Vercel — é o valor que o app manda
      # no header `apikey`.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
    volumes:
      - evolution-instances:/evolution/instances
    # Sem `ports:` de propósito — só o Caddy fala com este container, pela rede
    # interna do compose. Nada expõe a porta 8080 direto pra internet.

  caddy:
    image: caddy:2-alpine
    container_name: evolution-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - evolution-api

volumes:
  evolution-postgres-data:
  evolution-redis-data:
  evolution-instances:
  caddy-data:
  caddy-config:
